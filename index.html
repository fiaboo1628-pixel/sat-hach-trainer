<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1B4D8C" />
  <title>Sát Hạch Trainer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sát Hạch Trainer</h1>
    <p class="tagline">Luyện thi sa hình &amp; lý thuyết lái xe</p>
  </header>

  <main>
    <section id="menu">
      <button id="btn-bo-chuan" class="tile tile-blue" type="button">🔊 Bộ chuẩn</button>
      <button id="btn-bo-tu-ghep" class="tile tile-yellow" type="button">🧩 Bộ tự ghép</button>
      <button id="btn-ly-thuyet" class="tile tile-red" type="button">📘 Lý thuyết</button>
      <p class="menu-stats">600 câu lý thuyết · 316 ảnh biển báo/sa hình · 11 bài sa hình chuẩn</p>
    </section>

    <section id="view-bo-chuan" hidden>
      <h2>Bộ chuẩn (13 bài)</h2>
      <ol id="list-bo-chuan"></ol>
      <div class="action-row">
        <button id="play-bo-chuan" class="btn-primary" type="button">▶ Phát</button>
        <button id="stop-bo-chuan" class="btn-secondary" type="button">⏹ Dừng</button>
      </div>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-bo-tu-ghep" hidden>
      <h2>Bộ tự ghép</h2>
      <div class="ghep-columns">
        <div>
          <h3>Bấm để thêm bài</h3>
          <ul id="list-stations"></ul>
        </div>
        <div>
          <h3>Thứ tự đã chọn</h3>
          <ol id="list-selected"></ol>
        </div>
      </div>
      <div class="action-row">
        <button id="save-bo-tu-ghep" class="btn-secondary" type="button">💾 Lưu</button>
        <button id="play-bo-tu-ghep" class="btn-primary" type="button">▶ Phát</button>
        <button id="stop-bo-tu-ghep" class="btn-secondary" type="button">⏹ Dừng</button>
      </div>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-menu" hidden>
      <h2>Thi thử lý thuyết</h2>
      <button id="btn-hang-b" class="tile tile-blue" type="button">Hạng B (30 câu / 20 phút)</button>
      <button id="btn-hang-c1" class="tile tile-blue" type="button">Hạng C1 (35 câu / 22 phút)</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-exam" hidden>
      <h2>Đang làm bài</h2>
      <p id="theory-timer"></p>
      <ol id="theory-questions"></ol>
      <button id="theory-submit" class="btn-primary" type="button">Nộp bài</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-result" hidden>
      <h2>Kết quả</h2>
      <p id="theory-result-summary"></p>
      <button id="theory-retry" class="btn-primary" type="button">Thi lại</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <audio id="player"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
