<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sát Hạch Trainer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sát Hạch Trainer</h1>
  </header>

  <main>
    <section id="menu">
      <button id="btn-bo-chuan" type="button">Bộ chuẩn</button>
      <button id="btn-bo-tu-ghep" type="button">Bộ tự ghép</button>
      <button id="btn-ly-thuyet" type="button">Lý thuyết</button>
    </section>

    <section id="view-bo-chuan" hidden>
      <h2>Bộ chuẩn (13 bài)</h2>
      <ol id="list-bo-chuan"></ol>
      <button id="play-bo-chuan" type="button">▶ Phát</button>
      <button id="stop-bo-chuan" type="button">⏹ Dừng</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-bo-tu-ghep" hidden>
      <h2>Bộ tự ghép</h2>
      <div class="ghep-columns">
        <div>
          <h3>Bấm để thêm bài</h3>
          <ul id="list-stations"></ul>
        </div>
        <div>
          <h3>Thứ tự đã chọn</h3>
          <ol id="list-selected"></ol>
        </div>
      </div>
      <button id="save-bo-tu-ghep" type="button">💾 Lưu</button>
      <button id="play-bo-tu-ghep" type="button">▶ Phát</button>
      <button id="stop-bo-tu-ghep" type="button">⏹ Dừng</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-menu" hidden>
      <h2>Thi thử lý thuyết</h2>
      <button id="btn-hang-b" type="button">Hạng B (30 câu / 20 phút)</button>
      <button id="btn-hang-c1" type="button">Hạng C1 (35 câu / 22 phút)</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-exam" hidden>
      <h2>Đang làm bài</h2>
      <p id="theory-timer" role="status"></p>
      <ol id="theory-questions"></ol>
      <button id="theory-submit" type="button">Nộp bài</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <section id="view-theory-result" hidden>
      <h2>Kết quả</h2>
      <p id="theory-result-summary"></p>
      <button id="theory-retry" type="button">Thi lại</button>
      <button class="btn-back" type="button">← Quay lại</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <audio id="player"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
